name: Publish AyinYar v0.30.0 one time
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.30.0-once.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and apply source payload
        run: |
          python - <<'PY'
          import base64, hashlib, io, tarfile
          from pathlib import Path
          root=Path.cwd().resolve()
          parts=[(root/f'.release/payload-{n}.b64').read_text('ascii') for n in (1,2)]
          raw=base64.b64decode(''.join(''.join(parts).split()),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='5996c69bff65bdba082fc16e94ab2c61692edaca9af831f3a9a6f15a7f5bf24d'
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as archive:
              members=archive.getmembers()
              assert len(members)==24
              for member in members:
                  assert member.isfile() and not member.name.startswith('/')
                  assert not any(part in ('..','.git','dist') for part in Path(member.name).parts)
                  target=(root/member.name).resolve()
                  assert target.is_relative_to(root) and not target.is_symlink()
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(archive.extractfile(member).read())
          print('Validated and restored 24 source changes')
          PY
      - name: Install validation tools
        run: python -m pip install tinycss2 fonttools
      - name: Test complete release source
        run: |
          python scripts/build_release.py --validate-only
          python tests/test_runtime_bridges.py
          python tests/test_ai_onboarding.py
          python tests/test_core_regression.py
          python tests/test_ux_static.py
      - name: Remove one-time publisher and temporary payload
        run: git rm -- .release/payload-1.b64 .release/payload-2.b64 .github/workflows/publish-v0.30.0-once.yml
      - name: Build official assets
        run: python scripts/build_release.py
      - name: Commit audited code and publish v0.30.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.30.0 >/dev/null 2>&1; then echo 'Release exists; stopping'; exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: release AyinYar v0.30.0 UX redesign'
          git push origin HEAD:main
          RELEASE_SHA="$(git rev-parse HEAD)"
          gh release create v0.30.0 dist/*.xpi dist/*.zip dist/updates.json dist/SHA256SUMS.txt dist/BUILD_MANIFEST.json --target "$RELEASE_SHA" --title 'AyinYar Research v0.30.0 — Major UX Update' --notes-file RELEASE_NOTES_FA.md --latest
          gh release view v0.30.0 --json tagName,url,assets
