name: Stage validated AyinYar v0.30.0 source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.30.0-once.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and unpack pinned source
        run: |
          python - <<'PY'
          import base64,hashlib,io,tarfile
          from pathlib import Path
          root=Path.cwd().resolve()
          src=''.join((root/f'.release/payload-{n}.b64').read_text('ascii') for n in (1,2))
          raw=base64.b64decode(''.join(src.split()),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='5996c69bff65bdba082fc16e94ab2c61692edaca9af831f3a9a6f15a7f5bf24d'
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as t:
              members=t.getmembers()
              assert len(members)==24
              for m in members:
                  assert m.isfile() and not m.name.startswith('/')
                  p=(root/m.name).resolve()
                  assert p.is_relative_to(root) and not p.is_symlink()
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(t.extractfile(m).read())
          PY
      - name: Setup test requirements
        run: python -m pip install tinycss2 fonttools
      - name: Validate source and regression suites
        run: |
          python scripts/build_release.py --validate-only
          python tests/test_runtime_bridges.py
          python tests/test_ai_onboarding.py
          python tests/test_core_regression.py
          python tests/test_ux_static.py
      - name: Keep workflow definitions unchanged for restricted GitHub token
        run: git restore -- .github/workflows/release.yml .github/workflows/validate.yml
      - name: Commit source modifications (no workflow edits)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -E '^.github/workflows/'; then echo 'Refusing workflow edits'; exit 1; fi
          git diff --cached --check
          git commit -m 'feat: stage AyinYar v0.30.0 validated UX source'
          git push origin HEAD:main
