name: Publish AyinYar v0.30.0 final release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.30.0-final-once.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out locked validated source commit
        uses: actions/checkout@v4
        with:
          ref: 141b607b9b7dc2d5c30d4acec9cfe64a3b7ff0fe
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install validation dependencies
        run: python -m pip install tinycss2 fonttools brotli
      - name: Validate final release
        run: |
          python scripts/build_release.py --validate-only
          python tests/test_runtime_bridges.py
          python tests/test_ai_onboarding.py
          python tests/test_core_regression.py
          python tests/test_ux_static.py
      - name: Build distributable artifacts
        run: python scripts/build_release.py
      - name: Publish official GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.30.0 >/dev/null 2>&1; then echo 'v0.30.0 already published'; exit 1; fi
          gh release create v0.30.0 \
            dist/*.xpi dist/*.zip dist/updates.json dist/SHA256SUMS.txt dist/BUILD_MANIFEST.json \
            --target 141b607b9b7dc2d5c30d4acec9cfe64a3b7ff0fe \
            --title 'AyinYar Research v0.30.0 — Major UX Update' \
            --notes-file RELEASE_NOTES_FA.md \
            --latest
          gh release view v0.30.0 --json tagName,url,assets
