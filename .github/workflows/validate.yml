name: Validate AyinYar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CSS and font validators
        run: python -m pip install tinycss2 fonttools
      - name: Validate source
        run: python scripts/build_release.py --validate-only
      - name: Run mocked runtime tests
        run: python tests/test_runtime_bridges.py
      - name: Test API onboarding and provider links
        run: python tests/test_ai_onboarding.py
      - name: Smoke-test release package generation
        run: python scripts/build_release.py
