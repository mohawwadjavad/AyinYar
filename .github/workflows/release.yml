name: Build and publish AyinYar release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install validators
        run: python -m pip install tinycss2 fonttools
      - name: Validate source
        run: python scripts/build_release.py --validate-only
      - name: Run mocked runtime tests
        run: python tests/test_runtime_bridges.py
      - name: Test API onboarding and provider links
        run: python tests/test_ai_onboarding.py
      - name: Build release files
        run: python scripts/build_release.py
      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.xpi dist/*.zip dist/updates.json dist/SHA256SUMS.txt dist/BUILD_MANIFEST.json \
            --title "AyinYar Research $GITHUB_REF_NAME" \
            --notes-file CHANGELOG_FA.md
